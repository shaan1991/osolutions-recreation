<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | OSolutions LLC</title>
<meta name="description" content="Start a conversation with OSolutions LLC. We reply within one business day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="contact.html">
<div id="shell">
  <div class="pg-hd" style="text-align:center">
    <div class="pg-eyebrow">$ ./contact_osolutions.sh</div>
    <h1 class="pg-title">Start a conversation.</h1>
    <p class="pg-sub" style="margin:0 auto">We reply within one business day.</p>
  </div>

  <div class="term" style="margin-top:8px">
    <div class="term-bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="term-title">contact script</div>
      <div style="width:52px"></div>
    </div>
    <div class="term-body" id="cs-body"></div>
    <form id="cs-form" class="term-input-row" style="padding:0 22px 14px" autocomplete="off">
      <span class="prompt">contact.sh&gt;</span>
      <input id="cs-input" type="text" spellcheck="false" aria-label="contact script input">
    </form>
    <div class="term-hint">answer the prompts above, then press enter</div>
  </div>

  <div class="note">We use what you send only to respond to your inquiry. See the <a href="privacy.html" style="color:var(--w)">Privacy Policy</a> for the details.</div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
